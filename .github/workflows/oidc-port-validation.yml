name: OIDC fork repair validation

on:
  push:
    branches:
      - review/port-repair-fix
  pull_request:
    branches:
      - codex/blob-repair-20261009

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p "$RUNNER_TEMP/bichon-root"
      - run: cargo test -p bichon-core envelope::extractor::test --lib
        env:
          BICHON_ROOT_DIR: ${{ runner.temp }}/bichon-root
      - run: cargo check -p bichon-server
        env:
          BICHON_ROOT_DIR: ${{ runner.temp }}/bichon-root
