name: PR 371 exact-head validation

on:
  push:
    branches:
      - codex/validate-pr371-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10.18.3
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      - run: mkdir -p "$RUNNER_TEMP/bichon-root"
      - run: cargo test -p bichon-core envelope::extractor::test::placeholder_hashes_finds_unique_hashes --lib
      - run: cargo test -p bichon-core envelope::extractor::test::recovery_guards_reject_wrong_hash_and_message_id --lib
        env:
          BICHON_ROOT_DIR: ${{ runner.temp }}/bichon-root
      - run: cargo check -p bichon-server
