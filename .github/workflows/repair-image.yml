name: Build repair image

"on":
  push:
    branches:
      - codex/blob-repair-20261009
      - review/port-repair-fix

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: pr1-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10.18.3
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      - run: cargo build --release -p bichon-server -p bichon-cli -p bichon-admin
      - run: |
          mkdir -p docker/amd64
          cp target/release/bichon-server target/release/bichon-cli target/release/bichon-admin docker/amd64/
          cp LICENSE docker/amd64/
      - run: sed -i "s|^FROM ubuntu:24.04|FROM public.ecr.aws/docker/library/ubuntu:24.04|" docker/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          DOCKER_BUILDKIT=1 docker build \
            --file docker/Dockerfile \
            --build-arg CRATE_VERSION=2.1.1 \
            --build-arg TARGETARCH=amd64 \
            --tag ghcr.io/maxrink/bichon:${IMAGE_TAG} \
            docker
          docker push ghcr.io/maxrink/bichon:${IMAGE_TAG}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/maxrink/bichon:${IMAGE_TAG})
          echo "Image digest: ${digest#*@}" >> "$GITHUB_STEP_SUMMARY"
