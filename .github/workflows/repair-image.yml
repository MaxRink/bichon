name: Build repair image

"on":
  push:
    branches:
      - codex/blob-repair-20261009

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@10.18.3
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      - run: cargo build --release -p bichon-server -p bichon-cli -p bichon-admin
      - run: |
          mkdir -p docker/amd64
          cp target/release/bichon-server target/release/bichon-cli target/release/bichon-admin docker/amd64/
          cp LICENSE docker/amd64/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            CRATE_VERSION=2.1.1
            TARGETARCH=amd64
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/maxrink/bichon:codex-blob-repair-20261009"
      - run: 'echo "Image digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"'
