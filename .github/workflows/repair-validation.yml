name: Repair validation

on:
  push:
    branches:
      - codex/blob-repair-20261009
  pull_request:
    branches:
      - codex/blob-repair-20261009
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p bichon-core envelope::extractor::test --lib
