name: Repair validation

on:
  push:
    branches:
      - codex/blob-repair-20261009
  pull_request:
    branches:
      - codex/blob-repair-20261009
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check

  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p "$RUNNER_TEMP/bichon-root"
      - run: cargo test -p bichon-core envelope::extractor::test::placeholder_hashes_finds_unique_hashes --lib
      - run: cargo test -p bichon-core envelope::extractor::test::recovery_guards_reject_wrong_hash_and_message_id --lib
        env:
          BICHON_ROOT_DIR: ${{ runner.temp }}/bichon-root
