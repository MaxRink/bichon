name: Repair validation

on:
  push:
    branches:
      - codex/blob-repair-20261009
  pull_request:
    branches:
      - codex/blob-repair-20261009
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustfmt --edition 2021 --check crates/core/src/envelope/extractor.rs crates/server/src/rest/api/message.rs

  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          cargo test -p bichon-core envelope::extractor::test --lib --
          --bichon-root-dir "$RUNNER_TEMP/bichon-root"
